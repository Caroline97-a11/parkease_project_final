{% load static %}
{% load crispy_forms_tags %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ParkEase</title>

    <link rel="icon" type="image/png" href="images/logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

<body>
    
      <div>
        <h4 class="mb-0 fw-bold text-primary-emphasis text-center mt-5">
          Welcome to ParkEase System
        </h4>
        </div>

<div class="page-center">

    <div class="login-wrapper mt-0">

        <!-- LEFT (FORM) -->
        <div class="login-card">

            <h4 class="fw-bold text-primary text-center mb-2">ParkEase</h4>
            <p class="text-center text-muted mb-4">Login to continue</p>

            <form method="post">
                {% csrf_token %}

                {{ form|crispy }}

                <button type="submit" class="btn btn-primary w-100 mt-3">
                    Login
                </button>
            </form>

        </div>

        <!-- RIGHT (IMAGE) -->
        <div class="login-image"></div>

    </div>

</div>

</body>
</body>
</html>
