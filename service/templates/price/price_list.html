{% extends 'base.html' %}

{% block content %}

<div class="container py-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h4 class="fw-bold mb-0 text-primary">Tyre Service Prices</h4>
            <small class="text-muted">Manage all tyre service pricing</small>
        </div>

        <!-- ADD BUTTON -->
        <a href="{% url 'add_service_price' %}" class="btn btn-primary btn-sm shadow-sm">
            <i class="bi bi-plus-lg me-1"></i> Add Service
        </a>

    </div>

    <!-- TABLE CARD -->
    <div class="card border-0 shadow-sm">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <!-- TABLE HEAD -->
                <thead class="table-secondary">
                    <tr>
                        <th>Service</th>
                        <th>Price (UGX)</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <!-- TABLE BODY -->
                <tbody>

                    {% for price in prices %}
                    <tr>

                        <!-- SERVICE -->
                        <td class="fw-semibold">
                            {{ price.name }}
                        </td>

                        <!-- PRICE -->
                        <td class="text-primary fw-bold">
                            UGX {{ price.price }}
                        </td>

                        <!-- ACTIONS -->
                        <td>

                            <!-- EDIT -->
                            <a href="{% url 'edit_price' price.id %}" 
                               class="text-primary me-3"
                               title="Edit">
                                <i class="bi bi-pencil-fill"></i>
                            </a>

                            <!-- DELETE -->
                            <a href="{% url 'delete_price' price.id %}" 
                               class="text-danger"
                               title="Delete">
                                <i class="bi bi-trash"></i>
                            </a>

                        </td>

                    </tr>

                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-4 d-block mb-2"></i>
                            No service prices available
                        </td>
                    </tr>
                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
