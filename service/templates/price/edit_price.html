{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm border-0">
        <div class="card-header bg-light fw-semibold">
            Edit Service Price
        </div>

        <div class="card-body">

            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}

                <button type="submit" class="btn btn-primary mt-3">
                    Update
                </button>

                <a href="{% url 'service_price_list' %}" class="btn btn-secondary mt-3">
                    Cancel
                </a>
            </form>

        </div>
    </div>

</div>

{% endblock %}
