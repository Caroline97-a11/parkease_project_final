{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container py-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h4 class="fw-bold text-primary mb-0">Edit Tyre Service</h4>
            <small class="text-muted">Update tyre service details</small>
        </div>

        <!-- BACK BUTTON -->
        <a href="{% url 'tyre_list' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Back
        </a>

    </div>

    <!-- FORM CARD -->
    <div class="row justify-content-center">

        <div class="col-lg-8 col-xl-6">

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-light fw-semibold">
                    Service Information
                </div>

                <div class="card-body">

                    <form method="POST">
                        {% csrf_token %}

                        <!-- FORM -->
                        {{ form|crispy }}

                        <!-- ACTIONS -->
                        <div class="d-flex justify-content-between mt-4">

                            <a href="{% url 'tyre_list' %}" 
                               class="btn btn-light">
                                Cancel
                            </a>

                            <button type="submit" 
                                    class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>
                                Update Service
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
