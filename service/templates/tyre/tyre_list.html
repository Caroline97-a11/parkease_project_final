{% extends 'base.html' %}

{% block content %}

<div class="container py-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h4 class="fw-bold mb-0 text-primary">Tyre Services</h4>
            <small class="text-muted">All tyre service records</small>
        </div>

        <!-- ADD BUTTON -->
        <a href="{% url 'add_tyre_service' %}" class="btn btn-primary btn-sm shadow-sm">
            <i class="bi bi-plus-lg me-1"></i> Add Tyre
        </a>

    </div>

    <!-- TABLE CARD -->
    <div class="card border-0 shadow-sm">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <!-- TABLE HEAD -->
                <thead class="table-light">
                    <tr>
                        <th>Plate Number</th>
                        <th>Service</th>
                        <th>Price</th>
                        <th class="text-end">Action</th>
                    </tr>
                </thead>

                <!-- TABLE BODY -->
                <tbody>

                    {% for s in services %}
                    <tr>

                        <td class="fw-semibold">
                            {{ s.vehicle_plate }}
                        </td>

                        <td>
                            <span class="badge bg-secondary-subtle text-dark">
                                {{ s.service.name }}
                            </span>
                        </td>

                        <td class="fw-bold text-success">
                            UGX {{ s.service.price }}
                        </td>

                        <!-- ACTION -->
                        <td class="text-end">
                            <a href="{% url 'tyre_detail' s.id %}" 
                               class="text-primary fs-5 me-2"
                               title="View">
                                <i class="bi bi-eye"></i>
                            </a>
                        </td>

                    </tr>

                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-4 d-block mb-2"></i>
                            No tyre services recorded yet
                        </td>
                    </tr>
                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
