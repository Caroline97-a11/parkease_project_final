{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-sm text-center">

                <div class="card-body p-4">

                    <!-- Icon -->
                    <div class="mb-3">
                        <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
                    </div>

                    <!-- Title -->
                    <h4 class="fw-bold text-danger mb-2">
                        Delete Vehicle
                    </h4>

                    <!-- Message -->
                    <p class="text-muted mb-4">
                        Are you sure you want to delete this vehicle record?
                    </p>

                    <!-- Vehicle Details -->
                    <div class="border rounded p-3 mb-4 bg-light text-start">

                        <p class="mb-1">
                            <strong>Plate:</strong> {{ vehicle.plate_number }}
                        </p>

                        <p class="mb-1">
                            <strong>Driver:</strong> {{ vehicle.driver_name }}
                        </p>

                        <p class="mb-0">
                            <strong>Type:</strong> {{ vehicle.vehicle_type }}
                        </p>

                    </div>

                    <!-- Actions -->
                    <form method="post">
                        {% csrf_token %}

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                                Cancel
                            </a>

                            <button type="submit" class="btn btn-danger px-4">
                                <i class="bi bi-trash me-1"></i>
                                Delete
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

{% endblock %}
